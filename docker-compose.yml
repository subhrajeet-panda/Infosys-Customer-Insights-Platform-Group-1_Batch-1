services:
  postgres:
    image: postgres:16-alpine
    container_name: shopsense_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsense_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      PGHOST: postgres
      NODE_ENV: production
    ports:
      - "5000:5000"

  analytics:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: shopsense_analytics
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./analytics-service/.env
    environment:
      PGHOST: postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data:
    driver: local
